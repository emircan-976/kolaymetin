# Eş anlamlı kelime grupları (KD-K08: terim tutarlılığı)
# Lisans: CC BY 4.0 — kolaymetin katkıcıları
# Kolay Dil'de aynı şeye hep aynı adı verin. tercih: önerilen kelime.
# Bir grubun iki farklı üyesi aynı metinde geçerse araç uyarır.
- {grup: [başvuru, müracaat], tercih: başvuru}
# "ücret", "bedel", "fiyat", "tutar" grubu yok: aynı metinde çoğu zaman başka şeyleri anlatırlar
# ("iade edilecek bedelden kargo ücreti düşülür", "asgari ödeme tutarı" ile "kart ücreti").
- {grup: [belge, doküman, evrak, vesika], tercih: belge}
- {grup: [kimlik kartı, nüfus cüzdanı, kimlik belgesi], tercih: kimlik kartı}
