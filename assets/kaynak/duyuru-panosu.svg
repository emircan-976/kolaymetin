<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Boş durum görseli: mahalle duyuru panosu. Gri tonlu kaynak; scripts/dither.py ile 1-bit'e çevrilir. -->
  <defs>
    <linearGradient id="isik" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="tahta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="kagit1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="kagit2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <radialGradient id="golge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="220" fill="#ffffff"/>
  <ellipse cx="160" cy="206" rx="120" ry="10" fill="url(#golge)"/>
  <!-- ayaklar -->
  <rect x="62" y="150" width="12" height="58" fill="url(#tahta)"/>
  <rect x="246" y="150" width="12" height="58" fill="url(#tahta)"/>
  <!-- pano -->
  <rect x="40" y="20" width="240" height="140" fill="url(#tahta)"/>
  <rect x="50" y="30" width="220" height="120" fill="url(#isik)"/>
  <!-- kâğıtlar -->
  <g transform="rotate(-4 105 85)">
    <rect x="68" y="44" width="74" height="90" fill="url(#kagit1)"/>
    <rect x="78" y="58" width="54" height="6" fill="#222"/>
    <rect x="78" y="72" width="46" height="3" fill="#555"/>
    <rect x="78" y="80" width="52" height="3" fill="#555"/>
    <rect x="78" y="88" width="40" height="3" fill="#555"/>
    <rect x="78" y="104" width="50" height="3" fill="#777"/>
    <rect x="78" y="112" width="34" height="3" fill="#777"/>
  </g>
  <g transform="rotate(5 205 90)">
    <rect x="164" y="48" width="84" height="64" fill="url(#kagit2)"/>
    <rect x="174" y="60" width="44" height="8" fill="#1a1a1a"/>
    <rect x="174" y="76" width="64" height="3" fill="#666"/>
    <rect x="174" y="84" width="56" height="3" fill="#666"/>
    <rect x="174" y="92" width="60" height="3" fill="#666"/>
  </g>
  <rect x="176" y="118" width="60" height="26" fill="url(#kagit1)"/>
  <rect x="184" y="126" width="40" height="3" fill="#444"/>
  <rect x="184" y="134" width="28" height="3" fill="#444"/>
  <!-- raptiyeler -->
  <circle cx="104" cy="46" r="5" fill="#111"/>
  <circle cx="206" cy="50" r="5" fill="#111"/>
  <circle cx="206" cy="118" r="4" fill="#111"/>
</svg>
